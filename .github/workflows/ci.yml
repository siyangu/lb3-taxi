name: CI — C#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaxiService.Auth/TaxiService.Auth.csproj

      - name: Build
        run: dotnet build TaxiService.Auth/TaxiService.Auth.csproj --no-restore

      - name: Run tests with coverage
        run: dotnet test TaxiService.Auth.Tests/TaxiService.Auth.Tests.csproj --no-build --verbosity normal

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
